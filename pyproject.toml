[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pansis-toolbox"
version = "0.1.0"
description = "Plugin-style toolbox platform"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "cryptography>=42.0,<47.0",
  "paramiko>=3.4,<4.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "uvicorn[standard]>=0.29,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0"
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tools"]
pythonpath = ["."]
