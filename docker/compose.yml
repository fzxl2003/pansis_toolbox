services:
  pansis-toolbox:
    image: ${IMAGE_NAME:-pansis-toolbox}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${CONTAINER_NAME:-pansis-toolbox}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8000}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      STORAGE_DIR: /app/storage
      TOOLS_DIR: /app/tools
      FRONTEND_DIST_DIR: /app/frontend/dist
      PLATFORM_DB_PATH: /app/storage/data/platform.db
      WIDGET_LAYOUT_PATH: /app/storage/data/widget_layout.json
    volumes:
      - pansis-toolbox-storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pansis-toolbox-storage:
