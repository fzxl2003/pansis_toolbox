name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract base version from pyproject.toml
        id: version
        run: |
          echo "base_version=$(python3 -m backend.app.core.version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version
        id: image-version
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          image_version="$BASE_VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && docker buildx imagetools inspect "$IMAGE_NAME:$BASE_VERSION" >/dev/null 2>&1; then
            image_version="$BASE_VERSION-${GITHUB_SHA:0:7}"
          fi
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.image-version.outputs.image_version }}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.image-version.outputs.image_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_BUILD_VERSION=${{ steps.image-version.outputs.image_version }}
            VCS_REF=${{ github.sha }}
